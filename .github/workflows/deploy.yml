name: Auto Update Manifest & Deploy Pages

# 触发条件：
#   1. push 到 main 分支
#   2. 手动触发（在 Actions 页面点 Run workflow）
on:
  push:
    branches: [main]
  workflow_dispatch:

# 让 Actions 有权限写仓库 + 部署 Pages
permissions:
  contents: write
  pages: write
  id-token: write

# 防止并发部署冲突
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 扫描 posts/ 下所有 *.html，自动生成或更新 manifest.json
      # 命名规则：YYYY-MM-DD.html（其中 YYYY-MM-DD 是跑报告/push 的那天）
      # 日期逻辑：
      #   - slug /文件名 = 发布日（跑+push那天，通常是周一）
      #   - date_start / date_end = 内容覆盖的上一周（从 HTML masthead "监测周期" 行提取）
      #   - 首页按date_start 倒序排列，展示覆盖周期
      # - 从 HTML <title> 抽取标题
      # - 从 HTML 第一个 .lead 块抽取摘要（前 160 字符）
      - name: Auto-build manifest.json
        run: |
          node <<'EOF'
          const fs = require('fs');
          const path = require('path');

          const POSTS_DIR = 'posts';
          const MANIFEST_PATH = path.join(POSTS_DIR, 'manifest.json');

          // 读现有 manifest 的site 字段
          let existing = { site: {}, posts: [] };
          if (fs.existsSync(MANIFEST_PATH)) {
            try { existing = JSON.parse(fs.readFileSync(MANIFEST_PATH, 'utf8')); }
            catch (e) { console.warn('manifest.json parse failed, will rebuild'); }
          }

          // 扫描 posts/ 目录，文件名形如 2026-08-03.html
          const files = fs.readdirSync(POSTS_DIR)
            .filter(f => /^\d{4}-\d{2}-\d{2}\.html$/.test(f))
            .sort()
            .reverse();

          const fmt = d => d.toISOString().slice(0, 10);

          const posts = files.map(filename => {
            const fileRel = `${POSTS_DIR}/${filename}`;
            const slug = filename.replace(/\.html$/, '');
            const html = fs.readFileSync(fileRel, 'utf8');

            // 从 HTML <title> 提取标题
            const titleMatch = html.match(/<title>([^<]+)<\/title>/);

            // 从 .lead div 提取摘要
            const leadMatch = html.match(/<div class="lead"[^>]*>([\s\S]+?)<\/div>/);
            let summary = '';
            if (leadMatch) {
              summary = leadMatch[1]
                .replace(/<[^>]+>/g, '')
                .replace(/\s+/g, ' ')
                .replace(/^本周一句话总览[：:]\s*/, '')
                .trim()
                .slice(0, 160);
            }

            // 从 masthead-meta 里提取"监测周期：YYYY-MM-DD ~ YYYY-MM-DD"
            const periodMatch = html.match(/监测周期[：:]\s*(\d{4}-\d{2}-\d{2})\s*~\s*(\d{4}-\d{2}-\d{2})/);
            let dateStart, dateEnd;
            if (periodMatch) {
              dateStart = periodMatch[1];
              dateEnd = periodMatch[2];
            } else {
              // fallback：slug 是发布日（周一），覆盖上一周（周一到周日）
              const pubDate = new Date(slug + 'T00:00:00Z');
              const start = new Date(pubDate.getTime() - 7 * 24 * 3600 * 1000);
              const end = new Date(pubDate.getTime() - 1 * 24 * 3600 * 1000);
              dateStart = fmt(start);
              dateEnd = fmt(end);
            }

            // 生成 title：AI 行业周报 · MM月第N周（date_start ~ date_end）
            const ds = new Date(dateStart +'T00:00:00Z');
            const month = ds.getUTCMonth() + 1;
            const weekNum = Math.ceil(ds.getUTCDate() / 7);
            const autoTitle = `AI 行业周报 · ${month}月第${weekNum} 周（${dateStart} ~ ${dateEnd}）`;
            const title = titleMatch
              ? titleMatch[1].trim()
              : autoTitle;

            return {
              slug,
              file: fileRel,
              title: autoTitle,
              period_label: '',
              date_start: dateStart,
              date_end: dateEnd,
              summary,
            };
          });

          const out = {
            site: existing.site || {
              title: 'AI 行业周报',
              subtitle: 'Kiara 的每周 AI 产品观察 · 自动生成 + 人工走查',
              author: 'Kiara Zhang',
            },
            posts,
          };
          fs.writeFileSync(MANIFEST_PATH, JSON.stringify(out, null, 2) + '\n');
          console.log(`✅ manifest.json updated, ${posts.length} posts`);
          EOF

      - name: Commit manifest if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet posts/manifest.json; then
            git add posts/manifest.json
            git commit -m "chore: auto-update manifest.json [skip ci]"
            git push
          else
            echo "No manifest changes"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
